<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menus Example</title>
  <style>
    /* Horizontal Menu */
    .horizontal-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background-color: #333;
      overflow: hidden;
    }
    .horizontal-menu li { float: left; }
    .horizontal-menu a {
      display: block;
      color: #fff;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    .horizontal-menu a:hover { background-color: #111; }

    /* Vertical Menu */
    .vertical-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background-color: #333;
      width: 200px;
    }
    .vertical-menu li { border-bottom: 1px solid #555; }
    .vertical-menu a {
      display: block;
      color: #fff;
      padding: 14px 16px;
      text-decoration: none;
    }
    .vertical-menu a:hover { background-color: #111; }

    /* Burger Menu */
    .burger-menu { position: relative; display: inline-block; }
    .burger-icon {
      cursor: pointer;
      padding: 10px;
      background-color: #333;
    }
    .burger-icon div {
      width: 25px;
      height: 3px;
      background-color: #fff;
      margin: 5px 0;
    }
    .burger-menu ul {
      display: none;
      list-style: none;
      margin: 0;
      padding: 0;
      background-color: #333;
      position: absolute;
      top: 100%;
      left: 0;
    }
    .burger-menu li { border-bottom: 1px solid #555; }
    .burger-menu a {
      display: block;
      color: #fff;
      padding: 14px 16px;
      text-decoration: none;
    }
    .burger-menu a:hover { background-color: #111; }
    .burger-icon:hover + ul { display: block; }
  </style>
</head>
<body>

  <!-- Horizontal Menu -->
  <nav class="horizontal-menu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <br><br>

  <!-- Vertical Menu -->
  <nav class="vertical-menu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <br><br>

  <!-- Burger Menu -->
  <nav class="burger-menu">
    <div class="burger-icon">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
